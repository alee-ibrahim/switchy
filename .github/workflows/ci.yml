name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # onnxruntime-node's postinstall can fetch optional CUDA binaries on
      # linux/x64; CI only needs the CPU build that ships in the npm package.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install (root)
        run: npm ci

      - name: Install (web)
        run: npm --prefix web ci

      - name: Typecheck (root and web)
        run: npm run typecheck

      # No NDI runtime and no models/ or test/fixtures/private/ here: the tests
      # that need them skip themselves (describe.skipIf); nothing is downloaded.
      - name: Unit tests
        run: npm test

      - name: Build (server and web)
        run: npm run build

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build image (NDI runtime off)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: |
            INSTALL_NDI_RUNTIME=false
          tags: switchy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
